name: shoppinglist

services:
  mongodb:
    container_name: shoppinglist-mongodb
    image: mongo:8.3.7
    ports:
      - "${MONGO_PORT}:27017"
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", 'mongosh --quiet --eval "db.adminCommand(''ping'')"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - "./data/mongo_data:/data/db"
    restart: ${RESTART_POLICY}

  frontend:
    container_name: shoppinglist-frontend
    build:
      context: ../
      dockerfile: apps/frontend/Dockerfile
    ports:
      - "${FRONTEND_PORT}:5173"
    depends_on:
      api:
        condition: service_healthy
    restart: ${RESTART_POLICY}

  api:
    container_name: shoppinglist-api
    build:
      context: ../
      dockerfile: apps/api/Dockerfile
    ports:
      - "${API_PORT}:3000"
    environment:
      BASE_URL: http://localhost:${API_PORT}
      CORS_ORIGIN: http://localhost:${FRONTEND_PORT}
      MONGO_HOST: ${MONGO_HOST}
      MONGO_PORT: ${MONGO_PORT}
      MONGO_DB: ${MONGO_DB}
      MONGO_USER: ${MONGO_USER}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
    healthcheck:
      test:
        ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      mongodb:
        condition: service_healthy
    restart: ${RESTART_POLICY}

networks:
  default:
    name: shoppinglist-network
